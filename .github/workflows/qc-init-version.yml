name: 소팩 QC 브랜치 생성 및 DEV 버전 업데이트

on:
  create:

jobs:
  version-init:
    if: ${{ github.ref == 'refs/heads/apps/qc/sofac' }}
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Git 사용자 설정
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Python 3.8 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      # QC 브랜치 버전 초기화 (-beta.1)
      - name: QC build.gradle 버전 -beta.1 초기화
        run: |
          NEW_QC_VERSION=$(python bump_version.py --file_path apps/sofac/build.gradle --type 'qc')
          
          git add apps/sofac/build.gradle
          git commit -m "apps/qc/sofac init version: $NEW_QC_VERSION"
          git push origin apps/qc/sofac

      # dev 브랜치 체크아웃
      - name: dev 브랜치 체크아웃
        run: |
          git fetch origin apps/dev/sofac
          git checkout apps/dev/sofac

      # dev 브랜치 버전 초기화 minor+1, alpha.1 적용
      - name: DEV 브랜치 커밋 및 태그 푸시
        run: |
          NEW_DEV_VERSION=$(python bump_version.py --file_path apps/sofac/build.gradle --type 'minor')

          git add apps/sofac/build.gradle
          git commit -m "apps/dev/sofac version bump: $NEW_DEV_VERSION"
          git push origin apps/dev/sofac
